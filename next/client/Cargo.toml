[package]
name = "finance-client"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window","Document","Element","Event","EventTarget","HtmlInputElement",
  "HtmlTextAreaElement","HtmlSelectElement","HtmlElement","Request","Response",
  "RequestInit","RequestCredentials","Headers","Location","Crypto","Storage"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
finance-core = { path = "../core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
