[package]
name = "finance-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.7", features = ["d1"] }
finance-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
