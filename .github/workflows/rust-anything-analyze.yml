name: Rust-anything whole-app analysis
on:
  push:
    branches:
      - migration/rust-anything-whole-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rust-anything
        run: npm install --global rust-anything@2.0.0
      - name: Analyze entire repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust/evidence
          rust-anything --version | tee rust/evidence/tool-version.txt
          rust-anything analyze . --whole-app --json > rust/evidence/analyze-whole-app.json
          rust-anything analyze . --whole-app -o rust/evidence/PLAN.generated.md
          cat rust/evidence/PLAN.generated.md
      - name: Characterization tests
        run: npm test
      - name: Scaffold and record pure formatting unit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f rust/formatting-rs/rust-anything.json ]]; then
            rust-anything bridge . src/formatting.js
          fi
          echo "=== generated Rust crates ==="
          find rust -maxdepth 4 -type f | sort
          echo "=== generated Rust port stub ==="
          find rust -path '*/src/port.rs' -exec sh -c 'echo === $1 ===; sed -n "1,220p" "$1"' _ {} \;
          echo "=== record original behavior ==="
          crate=$(find rust -name rust-anything.json -printf '%h\n' | head -n1)
          if [[ -z "$crate" ]]; then
            echo "No crate manifest found"; exit 1
          fi
          echo "crate=$crate"
          if [[ ! -f "$crate/cases.jsonl" ]]; then
            rust-anything record "$crate"
          fi
          find "$crate" -maxdepth 3 -type f | sort
      - name: Install wasm-bindgen CLI matching locked crate
        shell: bash
        run: |
          set -euo pipefail
          version=0.2.130
          tmpdir="$(mktemp -d)"
          curl -fsSL --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" -o "$tmpdir/wasm-bindgen.tar.gz"
          tar xzf "$tmpdir/wasm-bindgen.tar.gz" -C "$tmpdir"
          binary="$(find "$tmpdir" -type f -name wasm-bindgen -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          "$binary" --version
      - name: Build, diff and gate Rust formatting unit
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo fmt --manifest-path rust/formatting-rs/Cargo.toml
          rust-anything build rust/formatting-rs 2>&1 | tee rust/evidence/formatting-build.txt
          rust-anything diff rust/formatting-rs 2>&1 | tee rust/evidence/formatting-diff.txt
          rust-anything gate rust/formatting-rs 2>&1 | tee rust/evidence/formatting-gate.txt
      - name: Record original data-schema validators
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f rust/validators-rs/rust-anything.json ]]; then
            rust-anything bridge . src/validators.js
          fi
          if [[ ! -f rust/validators-rs/cases.jsonl ]]; then
            rust-anything record rust/validators-rs
          fi
      - name: Upload analysis and bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-anything-analyze-and-first-bridge
          path: |
            rust/evidence/
            rust/formatting-rs/cases.jsonl
            rust/formatting-rs/src/port.rs
            rust/validators-rs/cases.jsonl
            rust/validators-rs/src/port.rs
          if-no-files-found: warn

      - name: Commit the generated Rust bridge and original cases
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/formatting-rs rust/validators-rs
          if ! git diff --cached --quiet; then
            git commit -m "migration: capture generated formatting bridge and baseline cases"
            git push origin HEAD:migration/rust-anything-whole-app
          fi
